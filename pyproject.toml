[project]
name = "posejdon"
version = "0.2.3"
description = "Polish-first text anonymization package using regex validators and optional GLiNER."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Posejdon contributors" }
]
dependencies = [
  "pydantic>=2.14.1",
  "pydantic-settings>=2.15.0",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pyright>=1.1.414",
  "ruff>=0.17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pyright>=1.1.414",
  "ruff>=0.17.0",
]
detectors = [
  "gliner>=0.2.29",
]
spacy = [
  "spacy>=3.8.16",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "benchmark: performance regression checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
