[project]
name = "posejdon"
version = "0.2.1"
description = "Polish-first text anonymization package using regex validators and optional GLiNER."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Posejdon contributors" }
]
dependencies = [
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.2",
  "regex>=2025.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pyright>=1.1.400",
  "ruff>=0.9.0",
]

[project.optional-dependencies]
detectors = [
  "gliner>=0.2.22",
]
spacy = [
  "spacy>=3.8.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "benchmark: performance regression checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
